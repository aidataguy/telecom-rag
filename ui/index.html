<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TelecomOps RAG — Intelligence Console</title>
<meta name="description" content="Local AI for Telecom Network Operations — Mistral 7B, ChromaDB, FastAPI">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060B18;--bg2:#0A1020;--bg3:#0E1628;--bg4:#121D33;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.1);--border3:rgba(255,255,255,0.15);
  --cyan:#00E5FF;--cyan-dim:rgba(0,229,255,0.12);--cyan-glow:rgba(0,229,255,0.25);
  --teal:#00BFA5;--green:#00E676;--amber:#FFD54F;--red:#FF5252;--purple:#BB86FC;--blue:#448AFF;
  --text:#EEF2FF;--text2:#8B9DC3;--text3:#4A5680;
  --mono:'JetBrains Mono',monospace;--sans:'Outfit',sans-serif;
  --radius:10px;--radius-sm:6px;
}
html,body,#root{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px}
body::before{content:'';position:fixed;top:-200px;left:-200px;width:600px;height:600px;background:radial-gradient(circle,rgba(0,229,255,0.04) 0%,transparent 70%);pointer-events:none;z-index:0}
body::after{content:'';position:fixed;bottom:-200px;right:-200px;width:500px;height:500px;background:radial-gradient(circle,rgba(187,134,252,0.04) 0%,transparent 70%);pointer-events:none;z-index:0}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

.app{display:grid;grid-template-columns:240px 1fr 300px;grid-template-rows:56px 1fr;height:100vh;overflow:hidden;position:relative;z-index:1}

/* HEADER */
.header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;background:rgba(6,11,24,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);position:relative;z-index:10}
.header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,229,255,0.3),transparent)}
.brand{display:flex;align-items:center;gap:12px}
.brand-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--cyan),var(--teal));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 0 20px rgba(0,229,255,0.25)}
.brand-name{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--text);letter-spacing:0.02em}
.brand-tag{font-family:var(--mono);font-size:9px;padding:3px 8px;border-radius:3px;background:var(--cyan-dim);color:var(--cyan);border:1px solid rgba(0,229,255,0.2);letter-spacing:0.1em}
.header-center{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px}
.hpill{display:flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;background:var(--bg4);border:1px solid var(--border);font-family:var(--mono);font-size:10px;color:var(--text3)}
.hdot{width:5px;height:5px;border-radius:50%}
.hdot.on{background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse-dot 2s infinite}
.hdot.off{background:var(--red)}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:0.4}}
.header-right{display:flex;align-items:center;gap:1rem}
.hstat{font-family:var(--mono);font-size:10px;color:var(--text3)}
.hstat span{color:var(--cyan)}

/* SIDEBAR */
.sidebar{background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sidebar-head{padding:1rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.sidebar-title{font-family:var(--mono);font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text3)}
.hcount{font-family:var(--mono);font-size:9px;padding:2px 6px;border-radius:3px;background:var(--bg4);color:var(--text3);border:1px solid var(--border)}
.hscroll{flex:1;overflow-y:auto;padding:8px}
.hitem{padding:10px 12px;border-radius:var(--radius-sm);cursor:pointer;margin-bottom:3px;border:1px solid transparent;transition:all 0.15s;position:relative;overflow:hidden}
.hitem::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--cyan);transform:scaleY(0);transition:transform 0.15s}
.hitem:hover{background:var(--bg3);border-color:var(--border)}
.hitem:hover::before,.hitem.active::before{transform:scaleY(1)}
.hitem.active{background:rgba(0,229,255,0.05);border-color:rgba(0,229,255,0.15)}
.hquery{font-size:11.5px;color:var(--text);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.hmeta{font-family:var(--mono);font-size:9px;color:var(--text3)}
.hempty{padding:2.5rem 1rem;text-align:center;font-family:var(--mono);font-size:10px;color:var(--text3);line-height:2}
.sidebar-foot{padding:0.75rem;border-top:1px solid var(--border)}
.new-btn{width:100%;padding:8px;background:var(--cyan-dim);border:1px solid rgba(0,229,255,0.2);border-radius:var(--radius-sm);color:var(--cyan);cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:0.05em;transition:all 0.15s}
.new-btn:hover{background:rgba(0,229,255,0.18);box-shadow:0 0 16px rgba(0,229,255,0.1)}

/* CHAT */
.chat-main{display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.chat-scroll{flex:1;overflow-y:auto;padding:2rem 2.5rem;display:flex;flex-direction:column;gap:2rem}
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;animation:fadeUp 0.5s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.welcome-glyph{font-size:2.8rem;margin-bottom:1.25rem;filter:drop-shadow(0 0 20px rgba(0,229,255,0.4));animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.welcome-h{font-size:1.7rem;font-weight:700;letter-spacing:-0.03em;background:linear-gradient(135deg,var(--text) 0%,var(--cyan) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:0.5rem}
.welcome-p{font-size:13px;color:var(--text2);line-height:1.7;max-width:420px;margin-bottom:2rem;font-weight:300}
.sugs{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:520px}
.sug{padding:10px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;text-align:left;font-size:11.5px;color:var(--text2);transition:all 0.15s;line-height:1.4}
.sug:hover{border-color:rgba(0,229,255,0.25);color:var(--text);background:rgba(0,229,255,0.04);transform:translateY(-1px)}

/* MESSAGES */
.msg{display:flex;gap:12px;animation:fadeUp 0.3s ease both}
.msg.user{flex-direction:row-reverse}
.avatar{width:32px;height:32px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:var(--mono)}
.msg.user .avatar{background:linear-gradient(135deg,var(--purple),var(--blue));color:white}
.msg.assistant .avatar{background:linear-gradient(135deg,var(--cyan),var(--teal));color:var(--bg)}
.msg-body{display:flex;flex-direction:column;gap:4px;max-width:75%}
.msg.user .msg-body{align-items:flex-end}
.msg-role{font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:0.08em;display:flex;align-items:center;gap:6px}
.bubble{padding:1rem 1.1rem;border-radius:12px;line-height:1.75;font-size:13.5px}
.msg.user .bubble{background:linear-gradient(135deg,rgba(187,134,252,0.12),rgba(68,138,255,0.12));border:1px solid rgba(187,134,252,0.2);border-radius:12px 4px 12px 12px;color:var(--text)}
.msg.assistant .bubble{background:var(--bg2);border:1px solid var(--border);border-radius:4px 12px 12px 12px;color:var(--text);position:relative}
.msg.assistant .bubble::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,var(--cyan),transparent);border-radius:12px 12px 0 0;opacity:0.4}
.cursor{display:inline-block;width:2px;height:15px;background:var(--cyan);margin-left:3px;vertical-align:middle;border-radius:1px;animation:blink 0.65s step-end infinite;box-shadow:0 0 6px var(--cyan)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* INPUT */
.input-zone{padding:1.25rem 2.5rem 1.5rem;border-top:1px solid var(--border);background:var(--bg);position:relative}
.input-zone::before{content:'';position:absolute;top:0;left:10%;right:10%;height:1px;background:linear-gradient(90deg,transparent,rgba(0,229,255,0.15),transparent)}
.input-box{display:flex;align-items:flex-end;gap:10px;background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:12px 14px;transition:all 0.2s}
.input-box:focus-within{border-color:rgba(0,229,255,0.35);box-shadow:0 0 0 3px rgba(0,229,255,0.06),0 0 24px rgba(0,229,255,0.08)}
.chat-ta{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-family:var(--sans);font-size:13.5px;resize:none;line-height:1.5;max-height:120px;min-height:22px}
.chat-ta::placeholder{color:var(--text3)}
.send{width:36px;height:36px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--cyan),var(--teal));color:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;transition:all 0.15s;font-weight:700;box-shadow:0 0 16px rgba(0,229,255,0.2)}
.send:hover:not(:disabled){transform:scale(1.08);box-shadow:0 0 24px rgba(0,229,255,0.35)}
.send:disabled{background:var(--bg4);color:var(--text3);cursor:not-allowed;transform:none;box-shadow:none}
.input-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding:0 2px}
.input-hint{font-family:var(--mono);font-size:9px;color:var(--text3)}

/* RIGHT PANEL */
.panel{background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--border)}
.tab{flex:1;padding:12px 8px;text-align:center;cursor:pointer;font-family:var(--mono);font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);border-bottom:2px solid transparent;transition:all 0.15s}
.tab.on{color:var(--cyan);border-bottom-color:var(--cyan)}
.tab:hover{color:var(--text2)}
.pcontent{flex:1;overflow-y:auto;padding:12px}

/* SOURCE CARDS */
.src-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px;transition:all 0.15s;position:relative;overflow:hidden}
.src-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px}
.src-card.incident_report::before{background:var(--red)}
.src-card.runbook::before{background:var(--teal)}
.src-card.telecom_standards_qa::before,.src-card.telecom_qa_processed::before{background:var(--cyan)}
.src-card.oran_qa::before{background:var(--purple)}
.src-card.root_cause_analysis::before{background:var(--amber)}
.src-card:hover{border-color:var(--border2);transform:translateY(-1px)}
.src-type{font-family:var(--mono);font-size:8px;letter-spacing:0.12em;text-transform:uppercase;margin-bottom:5px;margin-left:8px}
.src-type.incident_report{color:var(--red)}
.src-type.runbook{color:var(--teal)}
.src-type.telecom_standards_qa,.src-type.telecom_qa_processed{color:var(--cyan)}
.src-type.oran_qa{color:var(--purple)}
.src-type.root_cause_analysis{color:var(--amber)}
.src-title{font-size:11px;color:var(--text);line-height:1.45;margin-bottom:8px;margin-left:8px}
.src-tags{display:flex;flex-wrap:wrap;gap:4px;margin-left:8px}
.stag{font-family:var(--mono);font-size:8px;padding:2px 6px;border-radius:3px;background:var(--bg4);color:var(--text3);border:1px solid var(--border)}
.stag.P1{color:var(--red);border-color:rgba(255,82,82,0.3);background:rgba(255,82,82,0.08)}
.stag.P2{color:var(--amber);border-color:rgba(255,213,79,0.3);background:rgba(255,213,79,0.08)}
.stag.P3{color:var(--teal);border-color:rgba(0,191,165,0.25);background:rgba(0,191,165,0.07)}
.rel-row{display:flex;align-items:center;gap:8px;margin-top:8px;margin-left:8px}
.rel-label{font-family:var(--mono);font-size:8px;color:var(--text3);min-width:56px}
.rel-track{flex:1;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.rel-fill{height:100%;border-radius:2px;transition:width 0.6s ease}
.rel-pct{font-family:var(--mono);font-size:8px;color:var(--text3);min-width:28px;text-align:right}
.no-src{padding:3rem 1rem;text-align:center;font-family:var(--mono);font-size:10px;color:var(--text3);line-height:2}
.no-src-icon{font-size:1.5rem;margin-bottom:0.5rem;opacity:0.4}

/* GPU */
.gpu-hero{background:linear-gradient(135deg,rgba(0,229,255,0.05),rgba(0,191,165,0.05));border:1px solid rgba(0,229,255,0.12);border-radius:var(--radius);padding:1rem;margin-bottom:8px;position:relative;overflow:hidden}
.gpu-hero::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,var(--cyan),var(--teal));opacity:0.5}
.gpu-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px}
.gpu-sub{font-family:var(--mono);font-size:9px;color:var(--text2)}
.gpu-metric{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px}
.gm-label{font-family:var(--mono);font-size:9px;color:var(--text3);margin-bottom:4px}
.gm-val{font-size:1.2rem;font-weight:600;color:var(--text);margin-bottom:6px}
.gm-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.gm-fill{height:100%;border-radius:2px;transition:width 1s ease}
.gm-fill.ok{background:linear-gradient(90deg,var(--teal),var(--cyan))}
.gm-fill.warn{background:linear-gradient(90deg,var(--amber),var(--red))}
.gpu-mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.gm-mini{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px}
.gm-mini-l{font-family:var(--mono);font-size:8px;color:var(--text3);margin-bottom:3px}
.gm-mini-v{font-family:var(--mono);font-size:11px;color:var(--text);font-weight:500}
.ref-btn{width:100%;padding:8px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text2);cursor:pointer;font-family:var(--mono);font-size:9px;letter-spacing:0.05em;transition:all 0.15s}
.ref-btn:hover{border-color:var(--border2);color:var(--text)}

/* CONFIG */
.cfg-sec{margin-bottom:1.25rem}
.cfg-sec-h{font-family:var(--mono);font-size:8px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text3);padding-bottom:6px;border-bottom:1px solid var(--border);margin-bottom:8px}
.cfg-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0}
.cfg-k{font-family:var(--mono);font-size:9px;color:var(--text3)}
.cfg-v{font-family:var(--mono);font-size:9px;color:var(--cyan)}
.cfg-inp{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 10px;color:var(--text);font-family:var(--mono);font-size:10px;outline:none;margin-top:4px;transition:border-color 0.15s}
.cfg-inp:focus{border-color:rgba(0,229,255,0.3)}
.cfg-apply{width:100%;margin-top:6px;padding:7px;background:var(--cyan-dim);border:1px solid rgba(0,229,255,0.2);border-radius:var(--radius-sm);color:var(--cyan);cursor:pointer;font-family:var(--mono);font-size:9px;letter-spacing:0.06em;transition:all 0.15s}
.cfg-apply:hover{background:rgba(0,229,255,0.18);box-shadow:0 0 12px rgba(0,229,255,0.1)}
.range-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.range-row input[type=range]{flex:1;accent-color:var(--cyan)}
.range-val{font-family:var(--mono);font-size:10px;color:var(--cyan);min-width:20px;text-align:right}

/* TOAST */
.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid rgba(0,229,255,0.2);border-radius:var(--radius);padding:10px 20px;font-family:var(--mono);font-size:11px;color:var(--cyan);z-index:1000;animation:fadeUp 0.3s ease}

@media(max-width:900px){
  .app{grid-template-columns:1fr;grid-template-rows:56px 1fr}
  .sidebar,.panel{display:none}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback} = React;

// ── CHANGE THIS TO YOUR HF SPACE URL ──────────────────────────────────────────
const DEFAULT_API = "https://aidataguy-telecom-rag-api.hf.space";

const SUGS = [
  'How do I resolve BGP session down on eNodeB?',
  'What are the steps for Nokia 5G NR site commissioning?',
  'Runbook for high CPU utilization on MME',
  'P1 incident response for interface down on gNodeB',
];

const fmt = () => new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});

function RelBar({distance}){
  if(distance==null) return null;
  const pct = Math.max(0,Math.min(100,(1-distance)*100));
  const color = pct>70?'#00E676':pct>40?'#FFD54F':'#FF5252';
  return(
    <div className="rel-row">
      <span className="rel-label">relevance</span>
      <div className="rel-track"><div className="rel-fill" style={{width:`${pct}%`,background:color}}/></div>
      <span className="rel-pct">{pct.toFixed(0)}%</span>
    </div>
  );
}

function SrcCard({s,i}){
  const dt = s.doc_type||'';
  return(
    <div className={`src-card ${dt}`}>
      <div className={`src-type ${dt}`}>{dt.replace(/_/g,' ')}</div>
      <div className="src-title">{s.title||'Untitled'}</div>
      <div className="src-tags">
        {s.severity&&<span className={`stag ${s.severity}`}>{s.severity}</span>}
        {s.vendor&&<span className="stag">{s.vendor}</span>}
        {s.technology&&<span className="stag">{s.technology}</span>}
        {s.region&&<span className="stag">{s.region}</span>}
        {s.network_element&&<span className="stag">{s.network_element}</span>}
        {s.source&&<span className="stag">{s.source}</span>}
      </div>
      <RelBar distance={s.distance}/>
    </div>
  );
}

function GpuPanel({apiUrl}){
  const [stats,setStats]=useState(null);
  const [loading,setLoading]=useState(false);
  const load=useCallback(async()=>{
    setLoading(true);
    try{
      const r=await fetch(`${apiUrl}/health`,{signal:AbortSignal.timeout(4000)});
      if(r.ok) setStats({gpu:'HF Spaces CPU',model:'Mistral-7B-Instruct-v0.2',provider:'HuggingFace Inference API',embed:'nomic-embed-text-v1.5',status:'running',chunks:'31,364'});
      else setStats({err:true});
    }catch{setStats({err:true});}
    setLoading(false);
  },[apiUrl]);
  useEffect(()=>{load();},[]);
  return(
    <div>
      {stats&&!stats.err?(
        <>
          <div className="gpu-hero">
            <div className="gpu-name">{stats.gpu}</div>
            <div className="gpu-sub">Provider: {stats.provider}</div>
          </div>
          <div className="gpu-mini-grid">
            <div className="gm-mini"><div className="gm-mini-l">Chat Model</div><div className="gm-mini-v" style={{fontSize:'9px'}}>Mistral-7B</div></div>
            <div className="gm-mini"><div className="gm-mini-l">Embed Model</div><div className="gm-mini-v" style={{fontSize:'9px'}}>nomic-v1.5</div></div>
            <div className="gm-mini"><div className="gm-mini-l">Vector Chunks</div><div className="gm-mini-v">{stats.chunks}</div></div>
            <div className="gm-mini"><div className="gm-mini-l">Status</div><div className="gm-mini-v" style={{color:'var(--green)'}}>{stats.status}</div></div>
          </div>
          <div className="gpu-metric">
            <div className="gm-label">Inference Provider</div>
            <div style={{fontFamily:'var(--mono)',fontSize:'11px',color:'var(--cyan)',marginBottom:'4px'}}>HuggingFace Inference API</div>
            <div style={{fontFamily:'var(--mono)',fontSize:'9px',color:'var(--text3)'}}>mistralai/Mistral-7B-Instruct-v0.2</div>
          </div>
        </>
      ):stats?.err?(
        <div className="no-src"><div className="no-src-icon">⚠</div>Cannot reach API<br/><span style={{fontSize:'9px'}}>Check URL in Config tab</span></div>
      ):(
        <div className="no-src">Loading...</div>
      )}
      <button className="ref-btn" onClick={load} disabled={loading}>{loading?'↻ checking…':'↻ refresh status'}</button>
    </div>
  );
}

function CfgPanel({apiUrl,setApiUrl,topK,setTopK}){
  const [draft,setDraft]=useState(apiUrl);
  return(
    <div>
      <div className="cfg-sec">
        <div className="cfg-sec-h">API Connection</div>
        <div style={{fontFamily:'var(--mono)',fontSize:'9px',color:'var(--text3)',marginBottom:'4px'}}>base_url</div>
        <input className="cfg-inp" value={draft} onChange={e=>setDraft(e.target.value)} placeholder="https://aidataguy-telecom-rag-api.hf.space"/>
        <button className="cfg-apply" onClick={()=>setApiUrl(draft)}>apply →</button>
      </div>
      <div className="cfg-sec">
        <div className="cfg-sec-h">Retrieval</div>
        <div className="cfg-row"><span className="cfg-k">top_k chunks</span><span className="cfg-v">{topK}</span></div>
        <div className="range-row">
          <input type="range" min="1" max="10" value={topK} onChange={e=>setTopK(Number(e.target.value))}/>
          <span className="range-val">{topK}</span>
        </div>
        <div style={{display:'flex',justifyContent:'space-between',marginTop:'4px'}}>
          <span style={{fontFamily:'var(--mono)',fontSize:'8px',color:'var(--text3)'}}>1 · fast</span>
          <span style={{fontFamily:'var(--mono)',fontSize:'8px',color:'var(--text3)'}}>10 · thorough</span>
        </div>
      </div>
      <div className="cfg-sec">
        <div className="cfg-sec-h">System Info</div>
        {[
          ['backend','HuggingFace Spaces'],
          ['chat_model','Mistral-7B-Instruct-v0.2'],
          ['embed_model','nomic-embed-text-v1.5'],
          ['vector_store','ChromaDB'],
          ['chunks_indexed','31,364'],
          ['chunk_size','512 words'],
          ['built_by','Himanshu Patel'],
        ].map(([k,v])=>(
          <div key={k} className="cfg-row">
            <span className="cfg-k">{k}</span>
            <span className="cfg-v">{v}</span>
          </div>
        ))}
      </div>
      <div className="cfg-sec">
        <div className="cfg-sec-h">Links</div>
        <div style={{display:'flex',flexDirection:'column',gap:'6px'}}>
          <a href="https://github.com/aidataguy/telecom-rag" target="_blank" style={{fontFamily:'var(--mono)',fontSize:'9px',color:'var(--cyan)',textDecoration:'none'}}>→ GitHub Repository</a>
          <a href="https://aidataguy.github.io/telecom-rag" target="_blank" style={{fontFamily:'var(--mono)',fontSize:'9px',color:'var(--cyan)',textDecoration:'none'}}>→ Project Site</a>
          <a href={`${apiUrl}/docs`} target="_blank" style={{fontFamily:'var(--mono)',fontSize:'9px',color:'var(--cyan)',textDecoration:'none'}}>→ API Swagger Docs</a>
        </div>
      </div>
    </div>
  );
}

function App(){
  const [msgs,setMsgs]=useState([]);
  const [input,setInput]=useState('');
  const [streaming,setStreaming]=useState(false);
  const [sources,setSources]=useState([]);
  const [tab,setTab]=useState('sources');
  const [history,setHistory]=useState([]);
  const [activeH,setActiveH]=useState(null);
  const [apiUrl,setApiUrl]=useState(DEFAULT_API);
  const [topK,setTopK]=useState(5);
  const [apiOk,setApiOk]=useState(false);
  const [toast,setToast]=useState(null);
  const endRef=useRef(null);
  const taRef=useRef(null);

  useEffect(()=>{endRef.current?.scrollIntoView({behavior:'smooth'})},[msgs]);

  useEffect(()=>{
    const check=async()=>{
      try{const r=await fetch(`${apiUrl}/health`,{signal:AbortSignal.timeout(3000)});setApiOk(r.ok);}
      catch{setApiOk(false);}
    };
    check();
    const t=setInterval(check,15000);
    return()=>clearInterval(t);
  },[apiUrl]);

  const showToast=(msg)=>{setToast(msg);setTimeout(()=>setToast(null),3000)};

  const send=useCallback(async(q_)=>{
    const q=q_||input.trim();
    if(!q||streaming)return;
    setInput('');
    setMsgs(p=>[...p,{role:'user',content:q,time:fmt()}]);
    setSources([]);
    setMsgs(p=>[...p,{role:'assistant',content:'',time:fmt(),streaming:true}]);
    setStreaming(true);
    try{
      const r=await fetch(`${apiUrl}/query/stream`,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({query:q,top_k:topK}),
      });
      if(!r.ok) throw new Error(`HTTP ${r.status}`);
      const reader=r.body.getReader();
      const dec=new TextDecoder();
      let full='';
      while(true){
        const{done,value}=await reader.read();
        if(done)break;
        full+=dec.decode(value);
        setMsgs(p=>p.map((m,i)=>i===p.length-1?{...m,content:full}:m));
      }
      setMsgs(p=>p.map((m,i)=>i===p.length-1?{...m,streaming:false}:m));
      // Fetch sources separately
      try{
        const sr=await fetch(`${apiUrl}/query`,{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({query:q,top_k:topK}),
        });
        if(sr.ok){const d=await sr.json();setSources(d.sources||[]);setTab('sources');}
      }catch{}
      const hi={id:Date.now(),query:q,time:fmt(),answer:full};
      setHistory(p=>[hi,...p.slice(0,19)]);
      setActiveH(hi.id);
    }catch(e){
      setMsgs(p=>p.map((m,i)=>i===p.length-1?{...m,content:`⚠ ${e.message}. Check API URL in Config tab.`,streaming:false}:m));
      showToast('API error — check Config tab');
    }
    setStreaming(false);
  },[input,streaming,apiUrl,topK]);

  const loadH=(item)=>{
    setActiveH(item.id);
    setMsgs([
      {role:'user',content:item.query,time:item.time},
      {role:'assistant',content:item.answer,time:item.time},
    ]);
  };

  return(
    <div className="app">
      {toast&&<div className="toast">{toast}</div>}

      {/* Header */}
      <div className="header">
        <div className="brand">
          <div className="brand-icon">🛰</div>
          <span className="brand-name">TelecomOps RAG</span>
          <span className="brand-tag">INTELLIGENCE CONSOLE</span>
        </div>
        <div className="header-center">
          <div className="hpill">
            <div className={`hdot ${apiOk?'on':'off'}`}/>
            <span>{apiOk?'API online':'API offline'}</span>
          </div>
          <div className="hpill">
            <div className={`hdot ${apiOk?'on':'off'}`}/>
            <span>Mistral 7B · HF Inference</span>
          </div>
        </div>
        <div className="header-right">
          <div className="hstat"><span>31,364</span> chunks</div>
          <div className="hstat"><span>0</span> cloud data leaks</div>
          <a href="https://github.com/aidataguy/telecom-rag" target="_blank"
            style={{fontFamily:'var(--mono)',fontSize:'10px',color:'var(--cyan)',textDecoration:'none',padding:'4px 10px',border:'1px solid rgba(0,229,255,0.2)',borderRadius:'4px'}}>
            GitHub →
          </a>
        </div>
      </div>

      {/* Sidebar */}
      <div className="sidebar">
        <div className="sidebar-head">
          <span className="sidebar-title">History</span>
          <span className="hcount">{history.length}</span>
        </div>
        <div className="hscroll">
          {history.length===0?(
            <div className="hempty">No queries yet.<br/>Start asking.</div>
          ):history.map(item=>(
            <div key={item.id} className={`hitem ${activeH===item.id?'active':''}`} onClick={()=>loadH(item)}>
              <div className="hquery">{item.query}</div>
              <div className="hmeta">{item.time}</div>
            </div>
          ))}
        </div>
        <div className="sidebar-foot">
          <button className="new-btn" onClick={()=>{setMsgs([]);setSources([]);setActiveH(null)}}>
            + new conversation
          </button>
        </div>
      </div>

      {/* Chat */}
      <div className="chat-main">
        <div className="chat-scroll">
          {msgs.length===0?(
            <div className="welcome">
              <div className="welcome-glyph">🛰️</div>
              <div className="welcome-h">TelecomOps Intelligence</div>
              <div className="welcome-p">
                Ask about incident resolution, runbook procedures, network troubleshooting,
                or anything telecom operations. Powered by Mistral 7B via HuggingFace — your private data, zero cloud exposure.
              </div>
              <div className="sugs">
                {SUGS.map((s,i)=>(
                  <button key={i} className="sug" onClick={()=>send(s)}>{s}</button>
                ))}
              </div>
            </div>
          ):msgs.map((m,i)=>(
            <div key={i} className={`msg ${m.role}`}>
              <div className="avatar">{m.role==='user'?'HP':'AI'}</div>
              <div className="msg-body">
                <div className="msg-role">
                  <span>{m.role==='user'?'Himanshu':'TelecomOps RAG'}</span>
                  <span style={{color:'var(--text3)'}}>{m.time}</span>
                </div>
                <div className="bubble">
                  {m.content||(!m.streaming?'…':'')}
                  {m.streaming&&<span className="cursor"/>}
                </div>
              </div>
            </div>
          ))}
          <div ref={endRef}/>
        </div>
        <div className="input-zone">
          <div className="input-box">
            <textarea
              ref={taRef}
              className="chat-ta"
              value={input}
              onChange={e=>setInput(e.target.value)}
              onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}}
              placeholder="Ask about incidents, runbooks, BGP, 5G NR, eNodeB…"
              rows={1}
              disabled={streaming}
            />
            <button className="send" onClick={()=>send()} disabled={streaming||!input.trim()}>
              {streaming?'…':'↑'}
            </button>
          </div>
          <div className="input-foot">
            <span className="input-hint">Enter · send  ·  Shift+Enter · new line</span>
            <div style={{display:'flex',alignItems:'center',gap:'5px'}}>
              <div style={{width:5,height:5,borderRadius:'50%',background:apiOk?'var(--green)':'var(--red)'}}/>
              <span style={{fontFamily:'var(--mono)',fontSize:'9px',color:'var(--text3)'}}>{apiUrl.replace('https://','')}</span>
            </div>
          </div>
        </div>
      </div>

      {/* Right Panel */}
      <div className="panel">
        <div className="tabs">
          {[['sources','Sources'],['gpu','System'],['config','Config']].map(([id,label])=>(
            <div key={id} className={`tab ${tab===id?'on':''}`} onClick={()=>setTab(id)}>{label}</div>
          ))}
        </div>
        <div className="pcontent">
          {tab==='sources'&&(
            sources.length>0?sources.map((s,i)=><SrcCard key={i} s={s} i={i}/>):(
              <div className="no-src">
                <div className="no-src-icon">📡</div>
                Sources appear here<br/>after each query.
              </div>
            )
          )}
          {tab==='gpu'&&<GpuPanel apiUrl={apiUrl}/>}
          {tab==='config'&&<CfgPanel apiUrl={apiUrl} setApiUrl={setApiUrl} topK={topK} setTopK={setTopK}/>}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
